upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;

    # Maximum upload size for PDF files
    client_max_body_size 100M;

    # Proxy timeouts for long document ingestion tasks
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    # ── API: FastAPI backend ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
    }

    # ── Swagger docs ──────────────────────────────────────────────────
    location /docs {
        proxy_pass         http://backend/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass         http://backend/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Next.js HMR websocket (dev mode only) ─────────────────────────
    location /_next/webpack-hmr {
        proxy_pass         http://frontend/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
    }

    # ── Static assets (Next.js) ───────────────────────────────────────
    location /_next/ {
        proxy_pass         http://frontend/_next/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── All other routes → Next.js frontend ──────────────────────────
    location / {
        proxy_pass         http://frontend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
    }
}
